<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanmai's Personal Website!</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            font-family: Times New Roman, sans-serif;
            background-color: black; /* Starting screen background */
            height: 100vh;
            overflow: hidden; /* Prevent scrolling during animation */
        }

        /* Starting Screen */
        #starting-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #C11C84; /* Dark pink */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Ensure it's on top */
            transition: transform 2s ease-in-out; /* Slower animation */
        }

        /* Power Button */
        #power-button {
            width: 80px;
            height: 80px;
            background-color: red;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        /* Power Symbol */
        #power-button::before {
            content: "";
            width: 40px;
            height: 40px;
            border: 4px solid white;
            border-radius: 50%;
            position: absolute;
        }

        #power-button::after {
            content: "";
            width: 4px;
            height: 20px;
            background-color: white;
            position: absolute;
            top: 10px;
        }

        /* Main Container */
        #container {
            background-color: #FFB6C1; /* light pink */
            width: 850px;
            height: 650px;
            padding: 20px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
            border-radius: 20px; /* rectangle with rounded corners */
            text-align: center;
            position: relative;
            margin: 0 auto;
            transform: translateY(100%); /* Start off-screen */
            transition: transform 2s ease-in-out; /* Slower animation */
        }

        /* Back Button */
        #back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #C11C84; /* dark pink */
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Tabs */
        #tabs {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            position: absolute;
            bottom: 10px;
            width: 100%;
            left: 0;
            right: 0;
            padding: 0 20px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #FFB6C1; /* light pink */
            color: white;
            border-radius: 20px;
            transition: background-color 0.3s ease;
        }

        .tab:hover {
            background-color: #C11C84; /* dark pink */
        }

        .content {
            display: none;
            margin-top: 30px;
        }

        .content.active {
            display: block;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        ul li {
            margin: 10px 0;
        }

        a {
            text-decoration: none;
            color: #004d00; /* dark green */
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Starting Screen -->
    <div id="starting-screen">
        <div id="power-button" onclick="startAnimation()"></div>
    </div>
